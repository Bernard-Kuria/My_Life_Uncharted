name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add a step to navigate into the correct directory before running build
      - name: Install dependencies in project directory
        run: npm install

      - name: Run Next.js Build Script
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_LIFE_UNCHARTED }}
          channelId: live
          projectId: my-life-uncharted
