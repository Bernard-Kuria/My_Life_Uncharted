name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add installation step with working directory
      - name: Install dependencies in project directory
        run: npm install
        # working-directory: ./my_life_uncharted # Add this line

      # Modify the build step with working directory
      - name: Run build script
        run: npm run build
        # working-directory: ./my_life_uncharted # Add this line

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_LIFE_UNCHARTED }}
          projectId: my-life-uncharted
